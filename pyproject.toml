[project]
name = "agent-ecg"
version = "0.1.0"
description = "An ECG for coding agents: predict early whether a SWE-agent run will resolve its issue."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "huggingface_hub>=1.1",
    "numpy>=2.1",
    "pandas>=2.2",
    "pyarrow>=21",
    "scikit-learn==1.9.1",
    "scipy>=1.14",
    "timenet>=0.12.0",
    "timenet-connectors",
    "tokenizers>=0.23.3",
]

[project.scripts]
agent-ecg = "agent_ecg.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14"]
train = [
    "opentslm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
# Until OpenTSLM/TimeNet#832 is merged, the connector comes from its PR branch.
timenet-connectors = { git = "https://github.com/etienneRV/TimeNet", branch = "feature/nebius-swe-agent-trajectories", subdirectory = "packages/timenet-connectors" }
opentslm = { git = "https://github.com/OpenTSLM/OpenTSLM", rev = "2968f4b891baab4307f7e9d0043e87677b593a30" }

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]
